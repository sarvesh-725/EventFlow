services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: eventflow
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: eventflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow -d eventflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - eventflow-postgres:/var/lib/postgresql/data

volumes:
  eventflow-postgres:
