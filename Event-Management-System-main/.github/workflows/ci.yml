name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventflow
          POSTGRES_PASSWORD: eventflow
          POSTGRES_DB: eventflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventflow -d eventflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://eventflow:eventflow@localhost:5432/eventflow?schema=public
      DIRECT_DATABASE_URL: postgresql://eventflow:eventflow@localhost:5432/eventflow?schema=public
      API_ORIGIN: http://localhost:5000
      WEB_ORIGIN: http://localhost:3000
      SESSION_SECRET: ci-session-secret-that-is-at-least-32-characters-long
      TICKET_TOKEN_SECRET: ci-ticket-secret-that-is-at-least-32-characters-long
      INTERNAL_JOB_TOKEN: ci-job-secret-that-is-at-least-32-characters-long
      RUN_DB_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace=@eventflow/api
      - run: npm run db:validate --workspace=@eventflow/api
      - run: npm run db:deploy --workspace=@eventflow/api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test --workspace=@eventflow/api
      - run: npm run build
